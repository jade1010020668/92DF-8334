# Publica DotaciónPro como sitio estático en un Hugging Face Space.
#
# Requisito (una sola vez): crear un token de Hugging Face con permiso de
# escritura (huggingface.co/settings/tokens) y guardarlo en GitHub como
# secreto del repositorio con el nombre HF_TOKEN
# (Settings > Secrets and variables > Actions > New repository secret).
#
# El Space se crea solo si no existe. URL pública resultante:
#   https://huggingface.co/spaces/MORALES101002/dotacionpro
#   https://morales101002-dotacionpro.static.hf.space  (vista directa)

name: Publicar en Hugging Face Space

on:
  push:
    branches: [claude/create-plan-framework-aDC3Z]
    paths: ['dotacion-app/**', '.github/workflows/publicar-hf-space.yml']
  workflow_dispatch:

env:
  HF_SPACE: MORALES101002/dotacionpro

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dotacion-app/package-lock.json

      - name: Instalar dependencias
        working-directory: dotacion-app
        run: npm ci

      - name: Pruebas
        working-directory: dotacion-app
        run: npm test

      - name: Construir
        working-directory: dotacion-app
        run: npm run build

      - name: Subir al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Falta el secreto HF_TOKEN. Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          space = os.environ['HF_SPACE']
          api.create_repo(repo_id=space, repo_type='space', space_sdk='static', exist_ok=True)
          api.upload_folder(
              folder_path='dotacion-app/dist',
              repo_id=space,
              repo_type='space',
              commit_message='Despliegue automático desde GitHub Actions',
              delete_patterns=['assets/*'],
          )
          print(f'Publicado: https://huggingface.co/spaces/{space}')
          PY
